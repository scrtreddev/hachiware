# Cargo discovers config from the CURRENT WORKING DIRECTORY upward, so this
# file applies when you run cargo from inside crates/hachiware. That only works
# because this crate is its own workspace root (see the [workspace] table in
# Cargo.toml) — a config file inside an ordinary workspace *member* is ignored
# when cargo is driven from the workspace root.

[build]
# The whole crate is RP2350 firmware (Pico 2 W, Cortex-M33 with FPU), so the
# Pico is the default target and no --target flag is needed. rust-analyzer
# reads this too: without it, it checks the crate for the host and reports
# spurious errors from embassy-rp's `#[link_section = ".start_block"]`, which
# is not valid Mach-O.
target = "thumbv8m.main-none-eabihf"

[target.thumbv8m.main-none-eabihf]
# `cargo run` flashes over SWD through a second Pico running the `debugprobe`
# firmware, resets the target, and prints its defmt logs until Ctrl-C.
runner = "probe-rs run --chip RP235x"
# Without a probe (no logs): push it over USB to a Pico held in BOOTSEL mode.
# picotool knows the RP2350's UF2 family; elf2uf2-rs may not.
#   runner = "picotool load -u -v -x -t elf"

rustflags = [
  "-C", "link-arg=--nmagic",
  # cortex-m-rt's script: vector table and reset handler. It does
  # `INCLUDE memory.x`, which build.rs stages into OUT_DIR. memory.x also
  # places the IMAGE_DEF block the RP2350 boot ROM needs; there is no
  # separate embassy-rp script as there was for the RP2040's boot2.
  "-C", "link-arg=-Tlink.x",
  # defmt's script: keeps the table of interned log strings that probe-rs
  # reads from the ELF to turn log frames back into text.
  "-C", "link-arg=-Tdefmt.x",
]

[alias]
# `cargo probe`: flash over SWD through the debug probe and stream defmt logs.
# Same as `cargo run`, spelled out so the two flashing paths read as a pair.
probe = ["run", "--config", "target.thumbv8m.main-none-eabihf.runner='probe-rs run --chip RP235x'"]
# `cargo uf2`: no probe needed. Hold BOOTSEL while plugging the Pico in, then
# run this to load the firmware over USB. No logs this way.
# (Not called `flash`: probe-rs-tools ships a `cargo-flash` it would shadow.)
uf2 = ["run", "--config", "target.thumbv8m.main-none-eabihf.runner='picotool load -u -v -x -t elf'"]

[env]
# Compile-time log filter for defmt: trace / debug / info / warn / error.
DEFMT_LOG = "debug"
