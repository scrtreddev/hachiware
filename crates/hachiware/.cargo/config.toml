# Cargo discovers config from the CURRENT WORKING DIRECTORY upward, so this
# file applies when you run cargo from inside crates/hachiware. That only works
# because this crate is its own workspace root (see the [workspace] table in
# Cargo.toml) — a config file inside an ordinary workspace *member* is ignored
# when cargo is driven from the workspace root.

[build]
# The whole crate is RP2040 firmware, so the Pico is the default target and no
# --target flag is needed. rust-analyzer reads this too: without it, it checks
# the crate for the host and reports spurious errors from rp2040-boot2's
# `#[link_section = ".boot2"]`, which is not valid Mach-O.
target = "thumbv6m-none-eabi"

[target.thumbv6m-none-eabi]
# `cargo run` flashes over SWD through a second Pico running the `debugprobe`
# firmware, resets the target, and prints its defmt logs until Ctrl-C.
runner = "probe-rs run --chip RP2040"
# Without a probe (no logs): convert to .uf2 and copy onto a Pico mounted in
# BOOTSEL mode, or push it over USB without the mass-storage mount:
#   runner = "elf2uf2-rs -d"
#   runner = "picotool load -u -v -x -t elf"

rustflags = [
  "-C", "link-arg=--nmagic",
  # cortex-m-rt's script: vector table and reset handler. It does
  # `INCLUDE memory.x`, which build.rs stages into OUT_DIR.
  "-C", "link-arg=-Tlink.x",
  # embassy-rp's script: places the second-stage bootloader it supplies into
  # the BOOT2 region memory.x reserves. Without it the image has no .boot2
  # section and the chip will not start.
  "-C", "link-arg=-Tlink-rp.x",
  # defmt's script: keeps the table of interned log strings that probe-rs
  # reads from the ELF to turn log frames back into text.
  "-C", "link-arg=-Tdefmt.x",
]

[env]
# Compile-time log filter for defmt: trace / debug / info / warn / error.
DEFMT_LOG = "debug"
